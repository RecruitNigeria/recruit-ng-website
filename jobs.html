<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Find Jobs | Recruit NG</title>

  <meta
    name="description"
    content="Find verified job opportunities across Nigeria with Recruit NG."
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #10233f;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input,
    select {
      font: inherit;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      background: #071a33;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #168cff;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .nav-links a {
      color: white;
      font-size: 15px;
      font-weight: 600;
      opacity: 0.92;
    }

    .nav-links a:hover {
      color: #168cff;
    }

    .home-btn {
      border: 1px solid #168cff;
      padding: 9px 16px;
      border-radius: 7px;
      color: white !important;
    }

    .menu-btn {
      display: none;
      background: transparent;
      border: 0;
      color: white;
      font-size: 27px;
      cursor: pointer;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      background: linear-gradient(
        135deg,
        #071a33,
        #0c315b
      );

      color: white;
      padding: 65px 20px 75px;
      text-align: center;
    }

    .hero-content {
      max-width: 900px;
      margin: auto;
    }

    .hero h1 {
      font-size: clamp(35px, 6vw, 58px);
      line-height: 1.1;
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: #168cff;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      font-size: 18px;
      color: #d9e7f7;
    }


    /* =========================
       SEARCH AREA
    ========================= */

    .search-wrapper {
      max-width: 1100px;
      margin: -35px auto 0;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }

    .search-box {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .search-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 12px;
    }

    .search-field {
      position: relative;
    }

    .search-field input,
    .search-field select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dce5;
      border-radius: 7px;
      background: white;
      color: #10233f;
      outline: none;
    }

    .search-field input:focus,
    .search-field select:focus {
      border-color: #168cff;
      box-shadow: 0 0 0 3px rgba(22,140,255,0.1);
    }

    .search-btn {
      border: 0;
      border-radius: 7px;
      background: #168cff;
      color: white;
      padding: 0 23px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-btn:hover {
      background: #0874dc;
    }


    /* =========================
       JOB DIRECTORY
    ========================= */

    .jobs-section {
      max-width: 1100px;
      margin: 55px auto;
      padding: 0 20px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 25px;
    }

    .section-heading h2 {
      font-size: 30px;
      color: #071a33;
    }

    .section-heading p {
      color: #667085;
      font-size: 14px;
    }

    #resultsCount {
      color: #667085;
      font-size: 14px;
    }


    /* =========================
       JOB CARDS
    ========================= */

    .jobs-list {
      display: grid;
      gap: 18px;
    }

    .job-card {
      background: white;
      border: 1px solid #e1e7ef;
      border-radius: 12px;
      padding: 25px;
      transition: 0.2s ease;
    }

    .job-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16,35,63,0.08);
      border-color: #cbd8e8;
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .job-company {
      color: #667085;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .job-card h3 {
      font-size: 22px;
      color: #071a33;
      margin-bottom: 14px;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta {
      background: #f1f5f9;
      color: #344054;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .demo-label {
      display: inline-block;
      background: #fff4d6;
      color: #8a5a00;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .view-btn {
      align-self: center;
      background: #071a33;
      color: white;
      border: 0;
      border-radius: 7px;
      padding: 11px 18px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 700;
    }

    .view-btn:hover {
      background: #168cff;
    }


    /* =========================
       NO RESULTS
    ========================= */

    .no-results {
      display: none;
      text-align: center;
      padding: 55px 20px;
      background: white;
      border-radius: 12px;
      border: 1px solid #e1e7ef;
    }

    .no-results h3 {
      margin-bottom: 8px;
    }

    .no-results p {
      color: #667085;
    }


    /* =========================
       INFO SECTION
    ========================= */

    .info-section {
      background: #071a33;
      color: white;
      padding: 65px 20px;
      text-align: center;
    }

    .info-section div {
      max-width: 750px;
      margin: auto;
    }

    .info-section h2 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .info-section p {
      color: #d9e7f7;
    }


    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3,12,25,0.75);
      z-index: 2000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: white;
      max-width: 700px;
      margin: 70px auto;
      border-radius: 14px;
      padding: 32px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      right: 18px;
      top: 15px;
      border: 0;
      background: transparent;
      font-size: 30px;
      cursor: pointer;
      color: #667085;
    }

    .modal-company {
      color: #168cff;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .modal-content h2 {
      color: #071a33;
      font-size: 30px;
      margin-bottom: 15px;
      padding-right: 30px;
    }

    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .modal-description {
      color: #475467;
      margin-bottom: 25px;
      white-space: pre-line;
    }

    .apply-btn {
      display: inline-block;
      background: #168cff;
      color: white;
      padding: 12px 20px;
      border-radius: 7px;
      font-weight: 700;
    }

    .apply-btn:hover {
      background: #0874dc;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #041225;
      color: white;
      padding: 35px 20px;
    }

    .footer-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 30px;
    }

    .footer-content p {
      color: #aebdd0;
      max-width: 500px;
      margin-top: 8px;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .footer-links a {
      color: #c8d5e5;
      font-size: 14px;
    }

    .footer-links a:hover {
      color: #168cff;
    }

    .copyright {
      max-width: 1100px;
      margin: 30px auto 0;
      padding-top: 20px;
      border-top: 1px solid #19304e;
      color: #8d9db2;
      font-size: 13px;
    }


    /* =========================
       MOBILE
    ========================= */

        padding: 10px 0;
      }

        display: block;
      }

      }
